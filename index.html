<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>Expense Tracker</h1>
      <div class="balance-container">
        <h2>Your Balance</h2>
        <h1 id="balance">$0.00</h1>

        <div class="summary">
          <div class="income">
            <h3>Income</h3>
            <p id="income-amount">$0.00</p>
          </div>
          <div class="expenses">
            <h3>Expenses</h3>
            <p id="expense-amount">$0.00</p>
          </div>
        </div>
      </div>


      <div class="main-content">
        <div class="trasaction-container">
          <h2>Transactions</h2>
          <ul id="transaction-list">
            <!-- Transaction will here through js -->
          </ul>
        </div>

        <div class="form-container">
          <h2>Add Transaction</h2>

          <form id="transaction-form">
            <div class="form-group">
              <label for="Description">Description</label>
              <input type="text" id="description" placeholder="Enter description..." required />
            </div>

<!-- 
            <div class="form-group">
              <label for="Amount">Amount</label>
              <input type="number" id="amount" placeholder="Enter amount..." required />
              <small>Use negative (-) for expenses</small>
            </div>
            <button type="submit">Add Transaction</button>
          </form>
        </div>
      </div>
    </div> -->


    <!-- <form id="transaction-form">
  <div class="form-group">
    <label for="description">Description</label>
    <input type="text" id="description" placeholder="Enter description..." required />
  </div> -->

  <!-- 1. PASTE THIS NEW TYPE DROPDOWN HERE -->
  <div class="form-group">
    <label for="type">Type</label>
    <select id="type">
      <option value="income">Income (+)</option>
      <option value="expense">Expense (-)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="amount">Amount</label>
    <!-- 2. ADD step="any" HERE TO ALLOW DECIMALS -->
    <input type="number" step="any" id="amount" placeholder="Enter amount..." required />
  </div>

  <button type="submit">Add Transaction</button>
</form>
    <script src="script.js"></script>
  </body>
</html>
